[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamite-sampler"
version = "0.1.0"
description = "Python interface for the Dynamite Sampler load cell interface"
requires-python = ">=3.11"
dependencies = [
    "bleak>=0.21",
    "numpy>=1.26",
    "PyYAML>=6",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
